[extend]
useDefault = true

# NOTE: this must stay the singular [allowlist] table. The plural
# [[allowlists]] form is silently ignored as a global allowlist by the
# gitleaks version pinned in CI, which un-suppresses every entry below.
[allowlist]
description = "Synthetic credentials used to verify secret masking and authentication failures"
paths = [
  '''packages/ingestion/db/agent_session_test\.go''',
  '''packages/ingestion/masking/masking_test\.go''',
  # The chunk scrubber's fixtures must look like real keys -- the tests assert
  # a Stripe-shaped token does not survive redaction, so a token gitleaks
  # ignores would prove nothing.
  '''packages/ingestion/scrubber/scrubber_test\.go''',
  # The read handler repeats that guarantee after fetching stored chunks; keep
  # its realistic canary scoped to this integration-test file as well.
  '''packages/ingestion/handler/session_read_test\.go''',
  # The admin jobs redactor asserts realistic-shaped GitHub/npm/Slack/AWS/JWT
  # tokens are stripped from last_error before operators see it; a token
  # gitleaks ignores would prove nothing.
  '''packages/ingestion/handler/admin_test\.go''',
  # The ingest handler asserts a Stripe-shaped token in the wire runtime field
  # is redacted before persistence; a token gitleaks ignores would prove
  # nothing.
  '''packages/ingestion/handler/error_event_test\.go''',
  '''packages/sdk/src/__tests__/scrub\.test\.ts''',
  '''test-e2e/error-to-pr\.test\.ts''',
  '''test-e2e/replay-contract\.test\.ts''',
  # docs-sync's publish scanner test plants an AWS-shaped key and a generic
  # token to prove assertSecretFree() rejects them; a token gitleaks ignores
  # would prove nothing.
  '''scripts/__tests__/publish\.test\.mjs''',
  # The Slack formatter test asserts a Stripe-shaped token in an issue title
  # is masked before it reaches a webhook payload; a token gitleaks ignores
  # would prove nothing.
  '''packages/ingestion/notify/slack_test\.go''',
]
regexes = [
  # Deterministic canary values planted by the keyless E2E lane's token-leak
  # scan (.github/workflows/ci.yml). Not secrets by construction.
  '''OPSLANE-E2E-CANARY-[a-z]+-[0-9a-f]+''',
  # Documentation placeholder API key used in README/docs curl examples.
  '''e2e-test-key-plaintext''',
  # Synthetic 32-byte cipher key used by the notify crypto tests and quoted
  # in the notifications implementation plan. An obvious hex counter, not a
  # secret.
  '''0123456789abcdef0123456789abcdef''',
  # Deterministic poll token from the onboarding-reporting seed
  # (scripts/seed-onboarding.sql, quoted in the onboarding implementation
  # plan). The database stores only its hash; the raw value is published on
  # purpose so the smoke can authenticate against the seeded session.
  '''opt_9001e986d7d75a0051a2e832119dc17b3aec0390e8d1b986b0c2212fbc23cb5c''',
  # Project-key fixtures. Every documented and test example reuses the single
  # placeholder key id from the frozen S0 contract, so allowlisting that id
  # clears the fixtures without weakening detection: a real opslane_pk_,
  # opslane_sk_, or opslane_ak_ carries 128 random bits here and still trips
  # the scanner. Do NOT broaden this to the bare prefixes; the prefixes exist
  # precisely so scanners can spot a leaked key.
  '''opslane_(pk|sk|ak)_mzxw6ytboi3damrrgi3tknzxgq_[A-Za-z0-9_-]+''',
  # The browser fixture app's ingest key. Public by design: it ships inside a
  # bundle, which is the whole point of a public key, and it points at a
  # throwaway local project.
  '''opslane_pk_mzxw6ytboi3damrrgi3tknzxgq_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopq''',
  # Fake legacy key used to prove def_ credentials are rejected and redacted.
  # The format was retired in S1 and this exact UUID authenticates nothing.
  '''def_2f1c9a44-1b3e-4f4a-9c7a-4b2d8e6f0a11''',
  # Parser vector whose secret deliberately contains underscores. base64url
  # includes "_", so roughly half of all real keys contain one; this fixture
  # proves the parser splits on the first three separators only.
  '''a_b_c_deFGHIJKLMNOPQRSTUVWXYZ0123456789-_x''',
]
