[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opslane"
version = "0.1.0a2"
description = "Opslane Python SDK: backend error capture for the Opslane error-resolution engine"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Opslane" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "flask>=3", "gunicorn>=22"]

[project.urls]
Homepage = "https://github.com/opslane/opslane"
Repository = "https://github.com/opslane/opslane"

[tool.hatch.build.targets.wheel]
packages = ["opslane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
