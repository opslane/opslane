services:
  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      # Infrastructure publishes on loopback only: the credentials above are
      # committed dev defaults. Override the bind address for Colima or a
      # remote DOCKER_HOST, where "localhost" is inside the VM.
      - "${OPSLANE_INFRA_BIND_ADDR:-127.0.0.1}:${OPSLANE_MINIO_HOST_PORT:-9012}:9000"
    volumes:
      - minio-data:/data

  minio-setup:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    volumes:
      - ./scripts/minio-setup.sh:/minio-setup.sh:ro
    entrypoint: ["/minio-setup.sh"]
    environment:
      MINIO_INTERNAL_URL: http://minio:9000
      # Host-side port, passed in only so a failure can name it. The container
      # itself never dials it.
      MINIO_HOST_PORT: ${OPSLANE_MINIO_HOST_PORT:-9012}
      MINIO_READY_TIMEOUT_SECONDS: ${OPSLANE_MINIO_READY_TIMEOUT_SECONDS:-60}
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
      MINIO_BUCKET: opslane-replays

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: opslane
      POSTGRES_PASSWORD: opslane_dev
      POSTGRES_DB: opslane
    ports:
      # Loopback only; see the note on minio's published port.
      - "${OPSLANE_INFRA_BIND_ADDR:-127.0.0.1}:${OPSLANE_POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/ingestion/db/migrations:/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opslane -d opslane"]
      interval: 2s
      timeout: 5s
      retries: 10

  ingestion:
    build:
      context: .
      dockerfile: packages/ingestion/Dockerfile
    ports:
      - "${INGESTION_PORT:-8082}:8080"
    environment:
      DATABASE_URL: ${OPSLANE_COMPOSE_DATABASE_URL:-postgres://opslane:opslane_dev@postgres:5432/opslane?sslmode=disable}
      PORT: "8080"
      DASHBOARD_DIR: /app/dashboard
      REPLAY_STORE_ENDPOINT: http://minio:9000
      # Browser-visible: ingestion signs presigned replay uploads against this
      # origin, so it must name the HOST port, not the compose-network one.
      # It follows OPSLANE_MINIO_HOST_PORT automatically; setting this
      # explicitly WINS and stops it following. Keep both in sync, or set
      # neither. Point it at your public origin for a non-local self-host.
      REPLAY_STORE_PUBLIC_ENDPOINT: ${REPLAY_STORE_PUBLIC_ENDPOINT:-http://localhost:${OPSLANE_MINIO_HOST_PORT:-9012}}
      REPLAY_STORE_BUCKET: opslane-replays
      REPLAY_STORE_REGION: us-east-1
      REPLAY_STORE_ACCESS_KEY: minio
      REPLAY_STORE_SECRET_KEY: minio12345
      JWT_SECRET: opslane-dev-jwt-secret-key-minimum-32-bytes-long
      AUTH_PROVIDER: ${AUTH_PROVIDER:-github}
      # Follows INGESTION_PORT: a second stack that pinned 8082 here would send
      # its OAuth callback to the first stack's ingestion.
      AUTH_CALLBACK_ORIGIN: ${AUTH_CALLBACK_ORIGIN:-http://localhost:${INGESTION_PORT:-8082}}
      # Sealed into every source-map key minted by `cmd/mint-key`, so builds
      # need no endpoint variable of their own. Follows INGESTION_PORT for the
      # same second-stack reason as AUTH_CALLBACK_ORIGIN.
      OPSLANE_PUBLIC_INGEST_URL: ${OPSLANE_PUBLIC_INGEST_URL:-http://localhost:${INGESTION_PORT:-8082}}
      WORKOS_API_KEY: ${WORKOS_API_KEY:-}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-}
      AUTH_WORKOS_SOCIAL: ${AUTH_WORKOS_SOCIAL:-}
      ALLOW_REGISTRATION: "true"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-defender-dev}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      DASHBOARD_ORIGIN: ${DASHBOARD_ORIGIN:-http://localhost:3000}
      DASHBOARD_URL: ${DASHBOARD_URL:-}
      USAGE_EVENTS_SLACK_WEBHOOK: ${USAGE_EVENTS_SLACK_WEBHOOK:-}
      NOTIFY_UNSAFE_EXTRA_WEBHOOK_HOSTS: ${NOTIFY_UNSAFE_EXTRA_WEBHOOK_HOSTS:-}
      INTERNAL_READ_TOKEN: ${INTERNAL_READ_TOKEN:-dev-internal-token}
      ADMIN_EMAILS: ${OPSLANE_ADMIN_EMAILS:-}
      # Test lanes shorten the scrub tick. The retained 30s eligibility grace
      # is not tunable; shortening it is a separate privacy-timing decision.
      PRIORITY_SCORE_INTERVAL_SECONDS: ${PRIORITY_SCORE_INTERVAL_SECONDS:-}
      SCRUB_INTERVAL_SECONDS: ${SCRUB_INTERVAL_SECONDS:-}
    # Lets the e2e webhook sink on the host be reached from the container on
    # Linux; Docker Desktop resolves host.docker.internal natively.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    environment:
      DATABASE_URL: ${OPSLANE_COMPOSE_DATABASE_URL:-postgres://opslane:opslane_dev@postgres:5432/opslane}
      INGESTION_BASE_URL: http://ingestion:8080
      INTERNAL_READ_TOKEN: ${INTERNAL_READ_TOKEN:-dev-internal-token}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OPSLANE_GITHUB_URL: ${OPSLANE_GITHUB_URL:-}
      OPSLANE_GITHUB_API_URL: ${OPSLANE_GITHUB_API_URL:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-}
      USAGE_EVENTS_SLACK_WEBHOOK: ${USAGE_EVENTS_SLACK_WEBHOOK:-}
      E2B_API_KEY: ${E2B_API_KEY:-}
      OPSLANE_PYTHON_PIPELINE: ${OPSLANE_PYTHON_PIPELINE:-0}
      OPSLANE_E2B_PYTHON_TEMPLATE: ${OPSLANE_E2B_PYTHON_TEMPLATE:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://us.cloud.langfuse.com}
      LANGFUSE_PROJECT_ID: ${LANGFUSE_PROJECT_ID:-}
      POLL_INTERVAL_MS: "5000"
      SHUTDOWN_GRACE_MS: "25000"
      HEALTH_PORT: "8081"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio12345
      MINIO_BUCKET: opslane-replays
    depends_on:
      postgres:
        condition: service_healthy
      ingestion:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8081/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    # Must exceed SHUTDOWN_GRACE_MS or Docker SIGKILLs the worker before the
    # poll loop's own deadline fires and the graceful path never runs. Compose
    # defaults to 10s, which is below the 25s grace.
    stop_grace_period: 30s

  migrate:
    image: postgres:16
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./packages/ingestion/db/migrations:/migrations:ro
      - ./scripts/run-migrations.sh:/run-migrations.sh:ro
    entrypoint: ["/run-migrations.sh"]
    environment:
      MIGRATION_DIR: /migrations
      DATABASE_URL: ${OPSLANE_COMPOSE_DATABASE_URL:-postgres://opslane:opslane_dev@postgres:5432/opslane}

volumes:
  pgdata:
  minio-data:
