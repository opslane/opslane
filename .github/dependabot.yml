version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
      npm-majors:
        update-types:
          - major
  - package-ecosystem: pip
    directory: '/packages/sdk-python'
    schedule:
      interval: monthly
  - package-ecosystem: gomod
    directory: '/packages/ingestion'
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    ignore:
      # changesets/action v2 requires Changesets CLI v3; bump both together by hand.
      - dependency-name: changesets/action
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker
    directories:
      - '/packages/ingestion'
      - '/packages/worker'
    schedule:
      interval: monthly
